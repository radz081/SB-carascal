      <style>
         .hv-card{ border:1px solid rgba(var(--bs-primary-rgb,58,87,232),.08); border-radius:14px; box-shadow:0 2px 10px rgba(30,41,59,.05); }
         .hv-welcome{ background:linear-gradient(120deg, rgba(var(--bs-primary-rgb,58,87,232),.10), rgba(var(--bs-primary-rgb,58,87,232),.02)); }
         .hv-eyebrow{ font-size:.72rem; letter-spacing:.08em; text-transform:uppercase; font-weight:600; opacity:.85; margin-bottom:.25rem; color:var(--bs-primary,#3a57e8); }
         .hv-stat{ position:relative; overflow:hidden; transition:transform .15s ease, box-shadow .15s ease; }
         .hv-stat:hover{ transform:translateY(-2px); box-shadow:0 8px 20px rgba(30,41,59,.10); }
         .hv-stat::before{ content:""; position:absolute; left:0; top:0; bottom:0; width:4px; background:var(--hv-accent); }
         .hv-icon{ width:44px; height:44px; border-radius:12px; display:flex; align-items:center; justify-content:center; background:var(--hv-accent-soft); color:var(--hv-accent); flex:0 0 44px; }
         .hv-icon svg{ width:22px; height:22px; }
         .hv-num{ font-size:1.9rem; font-weight:700; line-height:1.1; }
         .hv-unit{ font-size:.75rem; opacity:.6; margin-left:.25rem; font-weight:500; }
         .hv-label{ font-size:.78rem; letter-spacing:.05em; text-transform:uppercase; opacity:.65; font-weight:600; margin:0; }
         .hv-section-title{ font-size:1rem; font-weight:600; margin:0; }
         .hv-badge{ background:rgba(var(--bs-primary-rgb,58,87,232),.12); color:var(--bs-primary,#3a57e8); border-radius:999px; padding:.15rem .7rem; font-size:.8rem; font-weight:600; }
         .hv-councilors{ display:grid; grid-template-columns:repeat(auto-fill,minmax(230px,1fr)); gap:10px; list-style:none; margin:0; padding:0; }
         .hv-councilors li{ display:flex; align-items:center; gap:12px; padding:8px 10px; border-radius:10px; border:1px solid rgba(100,116,139,.15); }
         .hv-avatar{ width:36px; height:36px; border-radius:50%; flex:0 0 36px; display:flex; align-items:center; justify-content:center; font-weight:700; font-size:.8rem; color:#fff; background:var(--bs-primary,#3a57e8); }
         .hv-glance-row{ display:flex; align-items:center; gap:14px; padding:14px 0; border-bottom:1px solid rgba(100,116,139,.15); }
         .hv-glance-row:last-child{ border-bottom:0; }
         .hv-glance-val{ margin-left:auto; font-size:1.5rem; font-weight:700; }
         @media (max-width:576px){ .hv-num{ font-size:1.5rem; } }
      </style>

      <script>
         // Live date/time for the home overview
         (function(){
            function tick(){
               var d = new Date();
               var dEl = document.getElementById('home_date');
               var tEl = document.getElementById('home_time');
               if(dEl) dEl.textContent = d.toLocaleDateString(undefined, {weekday:'long', year:'numeric', month:'long', day:'numeric'});
               if(tEl) tEl.textContent = d.toLocaleTimeString();
            }
            tick(); setInterval(tick, 1000);
         })();
      </script>
